name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, sign, and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          # A queued run must include version commits made by the preceding release.
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Bump patch version
        id: version
        shell: bash
        run: |
          VERSION="$(node scripts/bump-version.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json caido.config.ts
          git commit -m "chore: release $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build plugin package
        run: pnpm run build

      - name: Verify package version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          test -s dist/plugin_package.zip
          VERSION="$(unzip -p dist/plugin_package.zip manifest.json | jq -r .version)"
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Built manifest version $VERSION does not match $EXPECTED_VERSION."
            exit 1
          fi

      - name: Sign plugin package
        working-directory: dist
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [[ -z "$PRIVATE_KEY" ]]; then
            echo "The PRIVATE_KEY GitHub Actions secret is required."
            exit 1
          fi

          umask 077
          trap 'rm -f private_key.pem' EXIT
          printf '%s\n' "$PRIVATE_KEY" > private_key.pem
          openssl pkeyutl -sign -inkey private_key.pem -out plugin_package.zip.sig -rawin -in plugin_package.zip

      - name: Push release version
        # GITHUB_TOKEN pushes do not trigger another workflow run.
        run: git push origin HEAD:main

      - name: Create immutable release
        uses: caido/action-release@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          commit: ${{ steps.version.outputs.commit }}
          name: HTTPQL Colorizer ${{ steps.version.outputs.version }}
          body: Release ${{ steps.version.outputs.version }}
          artifacts: dist/plugin_package.zip,dist/plugin_package.zip.sig
          artifactErrorsFailBuild: true
          immutableCreate: true
